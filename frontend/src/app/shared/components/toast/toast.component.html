<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1200">
	@for (toast of toastService.toasts(); track toast.id) {
		<div
			class="toast show align-items-center border-0 mb-2"
			[class.toast-enter]="!toast.dismissing"
			[class.toast-exit]="toast.dismissing"
			[ngClass]="{
				'text-bg-success': toast.type === 'success',
				'text-bg-danger': toast.type === 'error',
				'text-bg-warning': toast.type === 'warning'
			}"
			role="alert"
			aria-live="assertive"
		>
			<div class="d-flex">
				<div class="toast-body fw-semibold">{{ toast.message }}</div>
				<button
					type="button"
					class="btn-close btn-close-white me-2 m-auto"
					(click)="toastService.dismiss(toast.id)"
					aria-label="Close"
				></button>
			</div>
		</div>
	}
</div>
