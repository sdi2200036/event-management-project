<div class="container py-4">
	<h2 class="fw-bold mb-4">Messages</h2>

	<!-- Tabs -->
	<ul class="nav nav-tabs mb-4">
		<li class="nav-item">
			<button
				class="nav-link"
				[class.active]="this.activeTab() === 'inbox'"
				(click)="this.switchTab(this.Tab.INBOX)"
			>
				Inbox
				@if (this.unreadCount() > 0) {
					<span class="badge bg-danger ms-1">{{ this.unreadCount() }}</span>
				}
			</button>
		</li>
		<li class="nav-item">
			<button
				class="nav-link"
				[class.active]="this.activeTab() === 'sent'"
				(click)="this.switchTab(this.Tab.SENT)"
			>
				Sent
			</button>
		</li>
		<li class="nav-item">
			<button
				class="nav-link"
				[class.active]="this.activeTab() === 'compose'"
				(click)="this.switchTab(this.Tab.COMPOSE)"
			>
				+ Compose
			</button>
		</li>
	</ul>

	@if (this.activeTab() === 'inbox' || this.activeTab() === 'sent') {
		<div class="row">
			<div class="col-md-4">
				<app-message-list
					[(selectedMessage)]="this.selectedMessage"
					[messages]="this.activeTab() === Tab.INBOX ? this.inbox() : this.sent()"
					[highlightUnread]="this.activeTab() === Tab.INBOX"
					(readMessage)="this.markAsRead($event)"
				></app-message-list>
			</div>
			<div class="col-md-8">
				@if (this.selectedMessage(); as selectedMessage) {
					<app-message-details
						[selectedMessage]="selectedMessage"
						[sentMode]="this.activeTab() === 'sent'"
						(deleteMessage)="this.deleteMessage(selectedMessage)"
					></app-message-details>
				}
			</div>
		</div>
	} @else {
		<app-message-compose (sendMessage)="this.sendMessage($event)"></app-message-compose>
	}
</div>
