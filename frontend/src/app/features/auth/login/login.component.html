<div class="container py-5">
	<div class="row justify-content-center">
		<div class="col-md-5">
			<div class="card shadow-sm border-0">
				<div class="card-body p-5">
					<h2 class="card-title text-center mb-4 fw-bold">Sign In</h2>

					<form (submit)="this.onSubmit($event)" novalidate>
						<div class="mb-3">
							<label for="username" class="form-label">Username</label>
							<input
								id="username"
								type="text"
								class="form-control"
								[formField]="this.loginFields.username"
								placeholder="Enter your username"
							/>
						</div>

						<div class="mb-4">
							<label for="password" class="form-label">Password</label>
							<input
								id="password"
								type="password"
								class="form-control"
								[formField]="this.loginFields.password"
								placeholder="Enter your password"
							/>
						</div>

						<button type="submit" class="btn btn-primary w-100" [disabled]="!this.loginFields().valid()">
							Sign In
						</button>
					</form>

					<hr />
					<p class="text-center text-muted mb-0">
						Don't have an account?
						<button
							type="button"
							(click)="this.goToRegister()"
							class="btn btn-link p-0 text-decoration-none align-baseline"
						>
							Register here
						</button>
					</p>
				</div>
			</div>
		</div>
	</div>
</div>
