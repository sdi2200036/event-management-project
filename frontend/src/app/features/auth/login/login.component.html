<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4 fw-bold">Sign In</h2>

          @if (error) {
            <div class="alert alert-danger" role="alert">
              {{ error }}
            </div>
          }

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                id="username"
                type="text"
                class="form-control"
                [formField]="loginFields.username"
                placeholder="Enter your username"
                />
              <div class="invalid-feedback">Username is required (min 3 characters)</div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input
                id="password"
                type="password"
                class="form-control"
                [formField]="loginFields.password"
                placeholder="Enter your password"
                />
              <div class="invalid-feedback">Password is required (min 6 characters)</div>
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100"
              [disabled]="!loginFields().valid() || loading"
              >
              @if (loading) {
                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
              }
              {{ loading ? 'Signing in...' : 'Sign In' }}
            </button>
          </form>

          <hr />
          <p class="text-center text-muted mb-0">
            Don't have an account?
            <a routerLink="/register" class="text-decoration-none">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
